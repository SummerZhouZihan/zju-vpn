name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check PowerShell and credential handling
        shell: powershell
        env:
          CI: 'true'
        run: ./tests/startup.test.ps1
      - name: Check startup wizard and authentication fixtures
        shell: powershell
        run: ./tests/wizard.test.ps1
      - name: Verify source archive
        shell: powershell
        run: ./scripts/package.ps1
